[project]
name = "iscc-usearch"
version = "0.1.0"
description = "A thin wrapper around USearch to support variable length bit-vectors and larger than RAM indexes."
readme = "README.md"
authors = [
    { name = "Titusz Pan", email = "tp@py7.de" }
]
requires-python = ">=3.12"
dependencies = [
    "numba>=0.62.1",
    "loguru>=0.7.3",
    "fastbloom-rs>=0.5.10",
    # usearch 2.23.2 patched wheels from iscc/usearch fork
    # Python 3.12
    "usearch @ https://iscc.github.io/usearch/usearch/usearch-2.23.2-cp312-cp312-macosx_10_13_universal2.whl ; sys_platform == 'darwin' and python_version == '3.12'",
    "usearch @ https://iscc.github.io/usearch/usearch/usearch-2.23.2-cp312-cp312-manylinux_2_26_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "usearch @ https://iscc.github.io/usearch/usearch/usearch-2.23.2-cp312-cp312-manylinux_2_26_aarch64.manylinux_2_28_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.12'",
    "usearch @ https://iscc.github.io/usearch/usearch/usearch-2.23.2-cp312-cp312-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.12'",
    "usearch @ https://iscc.github.io/usearch/usearch/usearch-2.23.2-cp312-cp312-win_arm64.whl ; sys_platform == 'win32' and platform_machine == 'ARM64' and python_version == '3.12'",
    # Python 3.13
    "usearch @ https://iscc.github.io/usearch/usearch/usearch-2.23.2-cp313-cp313-macosx_10_13_universal2.whl ; sys_platform == 'darwin' and python_version == '3.13'",
    "usearch @ https://iscc.github.io/usearch/usearch/usearch-2.23.2-cp313-cp313-manylinux_2_26_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
    "usearch @ https://iscc.github.io/usearch/usearch/usearch-2.23.2-cp313-cp313-manylinux_2_26_aarch64.manylinux_2_28_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.13'",
    "usearch @ https://iscc.github.io/usearch/usearch/usearch-2.23.2-cp313-cp313-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.13'",
    "usearch @ https://iscc.github.io/usearch/usearch/usearch-2.23.2-cp313-cp313-win_arm64.whl ; sys_platform == 'win32' and platform_machine == 'ARM64' and python_version == '3.13'",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.38.0",
    "bandit>=1.9.2",
    "prek>=0.2.19",
    "ty>=0.0.15",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.6",
    "zensical>=0.0.21",
    "mkdocstrings-python>=1.16.0",
]

[tool.ruff]
line-length = 119

[tool.ruff.format]
line-ending = "lf"

[tool.bandit]
skips = ["B101"]  # Allow assert statements for parameter validation

[tool.pytest.ini_options]
addopts = "--cov=iscc_usearch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
filterwarnings = []

[tool.coverage.run]
source = ["src/iscc_usearch"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ty.src]
include = ["src/iscc_usearch"]

[tool.ty.rules]
# Downgrade errors caused by usearch's incomplete type annotations
invalid-argument-type = "warn"
invalid-method-override = "warn"
invalid-return-type = "warn"
invalid-assignment = "warn"
no-matching-overload = "warn"
possibly-missing-attribute = "warn"

[tool.poe.tasks]
docs-serve = "zensical serve"
docs-build = "zensical build"
