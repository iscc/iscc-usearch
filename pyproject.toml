[project]
name = "iscc-usearch"
version = "0.1.0"
description = "A thin wrapper around USearch to support variable length bit-vectors and larger than RAM indexes."
readme = "README.md"
authors = [
    { name = "Titusz Pan", email = "tp@py7.de" }
]
requires-python = ">=3.12"
dependencies = [
    "usearch>=2.21.0",
    "numba>=0.62.1",
    "loguru>=0.7.3",
    "fastbloom-rs>=0.5.10",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.38.0",
    "bandit>=1.9.2",
    "prek>=0.2.19",
    "ty>=0.0.15",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 119

[tool.ruff.format]
line-ending = "lf"

[tool.bandit]
skips = ["B101"]  # Allow assert statements for parameter validation

[tool.pytest.ini_options]
addopts = "--cov=iscc_usearch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
filterwarnings = [
    # usearch IndexedKeys.__array__ doesn't support numpy 2.0 copy keyword yet
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/iscc_usearch"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ty.src]
include = ["src/iscc_usearch"]

[tool.ty.rules]
# Downgrade errors caused by usearch's incomplete type annotations
invalid-argument-type = "warn"
invalid-method-override = "warn"
invalid-return-type = "warn"
invalid-assignment = "warn"
