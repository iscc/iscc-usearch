[project]
name = "iscc-usearch"
version = "0.1.0"
description = "Scalable approximate nearest neighbor search for variable-length binary bit-vectors using NPHD metric."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Titusz Pan", email = "tp@py7.de" }
]
requires-python = ">=3.12"
keywords = [
    "iscc",
    "usearch",
    "nearest-neighbor-search",
    "similarity-search",
    "hamming-distance",
    "binary-vectors",
    "fingerprinting",
    "hnsw",
    "vector-search",
    "content-identification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]
dependencies = [
    "numba>=0.62.1",
    "loguru>=0.7.3",
    "fastbloom-rs>=0.5.10",
    "usearch-iscc>=2.23.5",
]

[project.urls]
Homepage = "https://usearch.iscc.codes/"
Documentation = "https://usearch.iscc.codes/"
Repository = "https://github.com/iscc/iscc-usearch"
Changelog = "https://github.com/iscc/iscc-usearch/blob/main/CHANGELOG.md"
Issues = "https://github.com/iscc/iscc-usearch/issues"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.38.0",
    "bandit>=1.9.2",
    "prek>=0.2.19",
    "ty>=0.0.15",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.6",
    "zensical>=0.0.21",
    "mkdocstrings-python>=1.16.0",
]

[tool.ruff]
line-length = 119

[tool.ruff.format]
line-ending = "lf"

[tool.bandit]
skips = ["B101"]  # Allow assert statements for parameter validation

[tool.pytest.ini_options]
addopts = "--cov=iscc_usearch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
filterwarnings = []

[tool.coverage.run]
source = ["src/iscc_usearch"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ty.src]
include = ["src/iscc_usearch"]

[tool.ty.rules]
# Downgrade errors caused by usearch's incomplete type annotations
invalid-argument-type = "warn"
invalid-method-override = "warn"
invalid-return-type = "warn"
invalid-assignment = "warn"
no-matching-overload = "warn"
possibly-missing-attribute = "warn"

[tool.poe.tasks]
docs-serve = "zensical serve"
docs-build = "zensical build"
