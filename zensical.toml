[project]
site_name = "iscc-usearch"
site_description = "Scalable approximate nearest neighbor search for variable-length binary bit-vectors."
site_author = "Titusz Pan"
site_url = "https://iscc.github.io/iscc-usearch/"
repo_url = "https://github.com/iscc/iscc-usearch"
repo_name = "iscc/iscc-usearch"
copyright = "Copyright &copy; 2025 ISCC Foundation"

nav = [
    "index.md",
    { "Tutorials" = [
        "tutorials/index.md",
        "tutorials/getting-started.md",
        "tutorials/variable-length.md",
    ]},
    { "How-to Guides" = [
        "howto/index.md",
        "howto/persistence.md",
        "howto/sharding.md",
        "howto/upsert.md",
        "howto/bloom-filters.md",
    ]},
    { "Explanation" = [
        "explanation/index.md",
        "explanation/nphd-metric.md",
        "explanation/architecture.md",
        "explanation/sharding-design.md",
        "explanation/performance.md",
    ]},
    { "Reference" = [
        "reference/index.md",
        "reference/api.md",
    ]},
    { "Development" = [
        "development/index.md",
        "development/contributing.md",
    ]},
]

[project.theme]
language = "en"
features = [
    "content.code.copy",
    "content.tabs.link",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "amber"
toggle = { icon = "lucide/sun", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle = { icon = "lucide/moon", name = "Switch to light mode" }

[project.plugins.mkdocstrings]
enabled = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
show_source = false
show_root_heading = true
show_root_full_path = false
members_order = "source"
heading_level = 2
merge_init_into_class = true
show_signature_annotations = true
separate_signature = true
